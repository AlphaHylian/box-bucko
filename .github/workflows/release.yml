name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build DMG
        run: make dmg

      - name: Create tag (for manual dispatch runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "${{ steps.tag.outputs.name }}"
          git push origin "${{ steps.tag.outputs.name }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.name }}" "dist/BoxBucko.dmg" \
            --repo "${{ github.repository }}" \
            --title "BoxBucko ${{ steps.tag.outputs.name }}" \
            --notes "Download **BoxBucko.dmg** below, open it, and drag BoxBucko into the Applications shortcut. No build step needed." \
            --latest
